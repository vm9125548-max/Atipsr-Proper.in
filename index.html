<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>atipsrproper.in | Master Money Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { background-color: #000; color: #fff; font-family: sans-serif; overflow-x: hidden; }
        .atipsr-header { position: sticky; top: 0; z-index: 1000; background: #0f0f0f; border-bottom: 1px solid #333; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; }
        #admin-panel { position: fixed; inset: 0; background: rgba(0,0,0,0.98); z-index: 50000; display: none; flex-direction: column; items: center; justify-content: center; padding: 20px; }
        .admin-box { background: #0a0a0a; border: 2px solid #3b82f6; border-radius: 40px; width: 100%; max-width: 420px; padding: 25px; text-align: center; box-shadow: 0 0 50px rgba(59,130,246,0.3); }
        .gullak-grid { display: grid; grid-template-cols: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .gullak-item { background: #111; padding: 15px; border-radius: 20px; border: 1px solid #333; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body>

    <div id="auth-gate" class="fixed inset-0 bg-black z-[20000] flex flex-col items-center justify-center p-6 text-center">
        <h1 class="text-6xl font-black text-blue-500 mb-2 tracking-tighter uppercase">atipsrproper.in</h1>
        <p class="text-gray-500 mb-10 text-xs tracking-[5px]">SMART SPLIT ENGINE</p>
        <button onclick="atipsrShining()" class="bg-white text-black px-12 py-4 rounded-full font-black flex items-center gap-3 shadow-2xl hover:scale-105 transition">
            GOOGLE SHINING
        </button>
    </div>

    <div id="main-app" class="hidden">
        <header class="atipsr-header">
            <h1 class="text-xl font-black"><span class="text-blue-500">ATIPSR</span> PROPER</h1>
            <div class="bg-blue-900/50 px-4 py-1 rounded-full border border-blue-500">
                <span class="text-[9px] font-bold text-blue-400">NET BANK: ₹<span id="cloud-balance">0.00</span></span>
            </div>
        </header>

        <div class="grid grid-cols-2 gap-2 p-4 mt-10">
            <button onclick="runRunwayAI()" class="col-span-2 p-4 rounded-3xl font-black text-xs bg-blue-600 uppercase border-b-4 border-blue-900">Create AI Video (₹500)</button>
            <button onclick="createLofi()" class="col-span-2 p-4 rounded-3xl font-black text-xs bg-indigo-700 uppercase border-b-4 border-indigo-900">Create Lofi Song (₹200)</button>
        </div>

        <div class="mx-4 p-6 bg-zinc-900 border-2 border-green-600 rounded-[40px] mb-10">
            <h3 class="text-xs font-black text-green-500 uppercase mb-4 text-center">🏦 WITHDRAWAL CENTER</h3>
            <input id="p-num" type="number" placeholder="Mobile Number" class="w-full bg-black border border-gray-800 rounded-2xl p-4 text-sm mb-3 outline-none">
            <input id="m-pwd" type="password" placeholder="Master Code" class="w-full bg-black border border-blue-900 rounded-2xl p-4 text-sm mb-3 outline-none">
            <button onclick="fPay()" class="w-full bg-green-600 py-4 rounded-2xl font-black text-xs text-white">CASH OUT SHARE</button>
        </div>

        <button onclick="accessAdmin()" class="w-full text-[9px] text-gray-800 font-bold mb-20 uppercase tracking-[5px]">[ OPEN MASTER ADMIN ]</button>
    </div>

    <div id="admin-panel">
        <div class="admin-box">
            <h2 class="text-lg font-black text-blue-500 mb-4 uppercase">4-गुल्लक मनी ट्रैकर</h2>
            <div class="gullak-grid">
                <div class="gullak-item border-orange-900">
                    <p class="text-[8px] text-gray-500 uppercase">11 Labs (25%)</p>
                    <p class="text-sm font-bold text-orange-500">₹<span id="g-11labs">0.00</span></p>
                </div>
                <div class="gullak-item border-blue-900">
                    <p class="text-[8px] text-gray-500 uppercase">Runway (25%)</p>
                    <p class="text-sm font-bold text-blue-500">₹<span id="g-runway">0.00</span></p>
                </div>
                <div class="gullak-item border-green-900">
                    <p class="text-[8px] text-gray-500 uppercase">Vaibhav (25%)</p>
                    <p class="text-sm font-bold text-green-500">₹<span id="g-vaibhav">0.00</span></p>
                </div>
                <div class="gullak-item border-purple-900">
                    <p class="text-[8px] text-gray-500 uppercase">Reserve (25%)</p>
                    <p class="text-sm font-bold text-purple-500">₹<span id="g-reserve">0.00</span></p>
                </div>
            </div>
            <div class="bg-zinc-900 p-4 rounded-3xl mt-4 border-2 border-white">
                <p class="text-[9px] text-gray-400 uppercase">Total Revenue (Ads Included)</p>
                <p class="text-3xl font-black text-white">₹<span id="admin-net">0.00</span></p>
            </div>
            <button onclick="closeAdmin()" class="mt-6 text-[10px] font-bold text-gray-600 uppercase tracking-widest">DASHBOARD EXIT</button>
        </div>
    </div>

    <script>
        // कॉन्फ़िगरेशन
        const firebaseConfig = {
            apiKey: "AIzaSyCNl_75ecS3KRt7cEn8zABfi2Cb9LwuFEk",
            databaseURL: "https://atipsr-proper-9693d-default-rtdb.firebaseio.com/" 
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        const MASTER_CODE = "VAIBHAV_ATIPSR_786";
        
        let wallets = {
            g11labs: 0,
            grunway: 0,
            gvaibhav: 0,
            greserve: 0,
            ads: 0
        };

        // क्लाउड से डेटा सिंक
        database.ref('atipsr_bank').on('value', (snapshot) => {
            const data = snapshot.val();
            if(data) {
                wallets = data;
                updateUI();
            }
        });

        function sync() { database.ref('atipsr_bank').set(wallets); }

        function splitMoney(amount) {
            let share = amount / 4;
            wallets.g11labs += share;
            wallets.grunway += share;
            wallets.gvaibhav += share;
            wallets.greserve += share;
            sync();
        }

        function createLofi() { splitMoney(200); alert("₹200 Cloud Bank में दर्ज!"); }
        function runRunwayAI() { splitMoney(500); alert("₹500 Cloud Bank में दर्ज!"); }

        function atipsrShining() { 
            document.getElementById('auth-gate').style.display='none'; 
            document.getElementById('main-app').classList.remove('hidden'); 
            // एड्स इंजन
            setInterval(() => { wallets.ads += 0.50; wallets.gvaibhav += 0.50; sync(); }, 15000); 
        }

        function fPay() {
            const pwd = document.getElementById('m-pwd').value;
            if(pwd === MASTER_CODE) {
                let regularCash = wallets.gvaibhav + wallets.g11labs + wallets.grunway + wallets.ads;
                let reserveCash = wallets.greserve;

                let choice = prompt("विकल्प चुनें: \n'1' - अपना मुनाफा (3 गुल्लक) निकालने के लिए\n'2' - डोमेन के लिए पूरा फंड निकालने के लिए");

                if(choice === "1") {
                    if(regularCash <= 0) return alert("मुनाफा जीरो है!");
                    wallets.gvaibhav = 0; wallets.g11labs = 0; wallets.grunway = 0; wallets.ads = 0;
                    sync();
                    alert("सफलता! आपका हिस्सा निकाल लिया गया।");
                } 
                else if(choice === "2") {
                    let totalAll = regularCash + reserveCash;
                    if(confirm("पूरा खजाना (₹" + totalAll.toFixed(2) + ") डोमेन के लिए निकालें?")) {
                        wallets.gvaibhav = 0; wallets.g11labs = 0; wallets.grunway = 0; wallets.ads = 0; wallets.greserve = 0;
                        sync();
                        alert("पूरा फंड विड्रॉ हो गया!");
                    }
                }
            } else { alert("गलत मास्टर कोड!"); }
        }

        function accessAdmin() {
            if(prompt("Master Code:") === MASTER_CODE) document.getElementById('admin-panel').style.display='flex';
        }

        function closeAdmin() { document.getElementById('admin-panel').style.display='none'; }

        function updateUI() {
            let net = wallets.g11labs + wallets.grunway + wallets.gvaibhav + wallets.greserve + wallets.ads;
            document.getElementById('g-11labs').innerText = wallets.g11labs.toFixed(2);
            document.getElementById('g-runway').innerText = wallets.grunway.toFixed(2);
            document.getElementById('g-vaibhav').innerText = (wallets.gvaibhav + wallets.ads).toFixed(2);
            document.getElementById('g-reserve').innerText = wallets.greserve.toFixed(2);
            document.getElementById('admin-net').innerText = net.toFixed(2);
            document.getElementById('cloud-balance').innerText = (wallets.gvaibhav + wallets.g11labs + wallets.grunway + wallets.ads).toFixed(2);
        }
    </script>
</body>
</html>
