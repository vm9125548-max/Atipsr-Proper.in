<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Atipsr Pro | Movie Empire</title>
    <style>
        body { background: #0a0a0a; color: #fff; font-family: Arial, sans-serif; margin: 0; padding: 20px; }
        header { text-align: center; padding: 20px; }
        .search-container { text-align: center; margin-bottom: 30px; }
        #search-bar { width: 80%; padding: 15px; border-radius: 25px; border: none; }
        .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        .movie-card { background: #1a1a1a; padding: 10px; border-radius: 10px; text-align: center; }
        .movie-card img { width: 100%; border-radius: 8px; }
    </style>
</head>
<body>

    <header>
        <h1>Atipsr Pro Empire</h1>
        <p>Aapka apna movie aur video hub</p>
    </header>

    <div class="search-container">
        <input type="text" id="search-bar" placeholder="Movie ya Remix ka naam likhein...">
    </div>

    <div class="movie-grid" id="main-hub">
        <!-- Yahan aapki videos/movies automatically aayengi -->
        <div class="movie-card">
            <h3>Remix 01</h3>
            <p>Coming Soon...</p>
        </div>
    </div>

</body>
</html>
